<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진행자</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap">
<div id="start" class="card"><h1>퀴즈 진행</h1><button id="create">새 퀴즈방 만들기</button><p id="error"></p></div>
<div id="lobby" class="hidden"><div class="card" style="text-align:center"><h2>QR을 찍어 입장하세요</h2><div class="room" id="code"></div><img id="qr" width="280" alt="참가 QR 코드"><p><span id="count">0</span>/40명 참가</p><div id="players" class="players"></div><br><button id="next">첫 문제 시작</button></div></div>
<div id="game" class="hidden"><div class="card"><div id="qno" class="muted"></div><h1 id="question">문제 대기 중</h1><img id="qimg" class="qimg hidden" alt="문제 이미지"><div id="answers" class="grid"></div><p>응답: <b id="answered">0</b>/<span id="totalPlayers">0</span></p><button id="next2" class="hidden">다음 문제</button><button id="finish" class="secondary">지금 종료</button></div><div class="card"><h2>현재 상위 순위</h2><div id="rank"></div></div></div>
<div id="final" class="hidden card"><h1>🏆 최종 순위</h1><div id="finalRank"></div></div>
</main><script src="/socket.io/socket.io.js"></script><script src="host.js"></script></body></html>
