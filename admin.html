<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문제 만들기</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap">
<div class="card"><h1>문제 만들기</h1>
<label>문제<textarea id="text" rows="3" style="width:100%" placeholder="문제를 입력하세요"></textarea></label>
<div class="form-row"><label>선택지 A<input id="c0" style="width:100%"></label><label>선택지 B<input id="c1" style="width:100%"></label><label>선택지 C<input id="c2" style="width:100%"></label><label>선택지 D<input id="c3" style="width:100%"></label></div>
<div class="form-row"><label>정답<select id="correct" style="width:100%"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option><option value="null">정답 없음(밸런스)</option></select></label><label>제한시간(초)<input id="seconds" type="number" min="5" max="120" value="15" style="width:100%"></label></div>
<label>문제 이미지<input id="image" type="file" accept="image/*" style="width:100%"></label><img id="preview" class="preview hidden" alt="이미지 미리보기">
<br><br><button id="save">문제 추가</button> <button id="cancel" class="secondary hidden">수정 취소</button> <a href="index.html">메인으로</a><p id="msg"></p></div>
<div class="card"><h2>등록된 문제</h2><div id="list"></div></div>
</main><script src="admin.js"></script></body></html>
