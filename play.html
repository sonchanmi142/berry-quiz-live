<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>참가 | RADIQ Live</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="brand"><span class="brand-mark">R</span><span>RADIQ LIVE</span></div><div id="join" class="card"><h1>퀴즈 입장</h1><input id="room" inputmode="numeric" maxlength="6" placeholder="방 번호 6자리" style="width:100%;margin-bottom:10px"><input id="name" maxlength="16" placeholder="닉네임" style="width:100%;margin-bottom:10px"><button id="joinBtn" style="width:100%">입장하기</button><p id="error"></p></div><div id="wait" class="hidden card" style="text-align:center"><h1>입장 완료!</h1><p>문제가 시작될 때까지 기다려주세요.</p></div><div id="quiz" class="hidden"><div class="card"><div id="qno"></div><h2 id="question"></h2><img id="qimg" class="qimg hidden" alt="문제 이미지"><div class="timer-row"><div id="timer" class="timer-number">--</div><div class="progress"><div id="bar" class="bar"></div></div></div><div id="choices" class="grid"></div></div></div><div id="submitted" class="hidden card" style="text-align:center"><h1>제출 완료</h1><p id="gained"></p><p>시간이 끝나면 정답이 공개됩니다.</p></div><div id="result" class="hidden card"><div class="result-box"><div id="myResult" class="muted"></div><div class="muted">정답</div><div id="correctAnswer" class="correct-answer"></div><p>다음 문제를 기다려주세요.</p></div></div><div id="final" class="hidden card"><h1>🏆 최종 순위</h1><div id="finalRank"></div></div></main><script src="/socket.io/socket.io.js"></script><script src="play.js"></script></body></html>
